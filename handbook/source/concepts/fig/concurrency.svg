<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="640" height="310" fill="#ffffff"/>

  <!-- Input signals -->
  <text x="14" y="154" font-weight="bold" fill="#222222">a</text>
  <text x="14" y="174" font-weight="bold" fill="#222222">b</text>
  <line x1="32" y1="150" x2="130" y2="150" stroke="#333333" stroke-width="1.6"/>
  <line x1="32" y1="170" x2="190" y2="170" stroke="#333333" stroke-width="1.6"/>

  <!-- Trunks (fan-out) -->
  <line x1="130" y1="65" x2="130" y2="205" stroke="#333333" stroke-width="1.6"/>
  <line x1="190" y1="95" x2="190" y2="235" stroke="#333333" stroke-width="1.6"/>
  <circle cx="130" cy="150" r="3.5" fill="#333333"/>
  <circle cx="190" cy="170" r="3.5" fill="#333333"/>
  <circle cx="130" cy="205" r="3.5" fill="#333333"/>
  <circle cx="190" cy="95" r="3.5" fill="#333333"/>

  <!-- Branches to the adder -->
  <line x1="130" y1="65" x2="298" y2="65" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="190" y1="95" x2="298" y2="95" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Branches to the subtractor -->
  <line x1="130" y1="205" x2="298" y2="205" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="190" y1="235" x2="298" y2="235" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="190" cy="235" r="0" fill="#333333"/>

  <!-- Adder -->
  <rect x="300" y="40" width="120" height="80" rx="6" fill="#e8f0fe" stroke="#1a56b0" stroke-width="2"/>
  <text x="308" y="69" font-size="12" fill="#444444">A</text>
  <text x="308" y="99" font-size="12" fill="#444444">B</text>
  <text x="372" y="76" text-anchor="middle" font-weight="bold" fill="#1a56b0">Adder</text>
  <text x="372" y="96" text-anchor="middle" fill="#1a56b0">a + b</text>

  <!-- Subtractor -->
  <rect x="300" y="180" width="120" height="80" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
  <text x="308" y="209" font-size="12" fill="#444444">A</text>
  <text x="308" y="239" font-size="12" fill="#444444">B</text>
  <text x="372" y="216" text-anchor="middle" font-weight="bold" fill="#b3261e">Subtractor</text>
  <text x="372" y="236" text-anchor="middle" fill="#b3261e">a − b</text>

  <!-- Outputs -->
  <line x1="420" y1="80" x2="518" y2="80" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="528" y="85" font-weight="bold" fill="#222222">sum</text>
  <line x1="420" y1="220" x2="518" y2="220" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="528" y="225" font-weight="bold" fill="#222222">diff</text>

  <!-- Annotation between the blocks -->
  <text x="360" y="155" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">operate simultaneously</text>
  <text x="360" y="171" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">(same inputs, no execution order)</text>

  <!-- Caption -->
  <text x="320" y="295" text-anchor="middle" font-size="12" fill="#555555">assign sum = a + b;  assign diff = a - b;  →  two independent blocks fed by the same signals</text>
</svg>
